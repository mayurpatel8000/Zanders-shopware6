<VirtualHost *:80>
    ServerName shopware6-zander.local
    ServerAlias www.shopware6-zander.local
    DocumentRoot /var/www/html/shopware6-zander

    <Directory /var/www/html/shopware6-zander>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Optimized PHP limits for Shopware 6 installation
    <IfModule mod_php.c>
        php_value memory_limit 512M
        php_value max_execution_time 300
        php_value upload_max_filesize 64M
        php_value post_max_size 64M
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/shopware6-zander_error.log
    CustomLog ${APACHE_LOG_DIR}/shopware6-zander_access.log combined
</VirtualHost>

